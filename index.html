<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js untuk render Markdown dari AI -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: #374151;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Container Utama -->
    <div class="w-full max-w-2xl bg-slate-900/80 border border-slate-800 backdrop-blur-md rounded-2xl shadow-2xl p-6 flex flex-col h-[85vh]">
        
        <!-- Header -->
        <div class="text-center mb-4 flex-shrink-0">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-purple-500/10 text-purple-300 border border-purple-500/20 mb-2">
                🤖 Powered by Llama 3 & Flask
            </span>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-purple-400 to-indigo-300 bg-clip-text text-transparent">
                AI Study Assistant
            </h1>
            <p class="text-slate-400 text-sm mt-1">Tanyakan apa saja tentang pelajaranmu. AI siap membantu 24/7.</p>
        </div>

        <!-- Area Chat Box -->
        <div id="chat-box" class="flex-1 overflow-y-auto chat-scroll bg-slate-950/60 rounded-xl p-4 border border-slate-800/80 space-y-4 mb-4">
            <!-- Pesan Sambutan Awal -->
            <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-center text-xs font-bold flex-shrink-0">
                    AI
                </div>
                <div class="bg-slate-800/90 border border-slate-700/50 rounded-2xl rounded-tl-none p-3.5 text-sm text-slate-200 max-w-[85%] leading-relaxed shadow-sm">
                    Halo! Aku tutor AI belajarmu. Ada materi, kuis, atau tugas yang ingin kamu tanyakan hari ini?
                </div>
            </div>
        </div>

        <!-- Form Input Chat -->
        <form id="chat-form" class="flex flex-col gap-2 flex-shrink-0">
            <div class="relative flex items-center">
                <textarea 
                    id="user-input" 
                    rows="2" 
                    placeholder="Ketik pertanyaanmu di sini... (Contoh: Apa itu REST API?)" 
                    class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 pr-24 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 resize-none"
                    required
                ></textarea>
                <button 
                    type="submit" 
                    id="send-btn"
                    class="absolute right-2.5 bottom-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition duration-200 flex items-center gap-1 shadow-md hover:shadow-purple-500/20 active:scale-95 disabled:opacity-50"
                >
                    <span>Kirim</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>
            </div>
            <p class="text-[11px] text-slate-500 text-center">💡 Tips: Tanya konsep programming, kuis, atau tugas.</p>
        </form>

    </div>

    <!-- Script JavaScript logika Chat -->
    <script>
        const chatBox = document.getElementById('chat-box');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Fungsi Auto Scroll ke Bawah Chat
        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Fungsi Tambah Pesan ke Chat Box
        function appendMessage(sender, text, isMarkdown = false) {
            const isUser = sender === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0 ${
                isUser ? 'bg-indigo-600' : 'bg-purple-600'
            }`;
            avatar.innerText = isUser ? 'Kamu' : 'AI';

            const content = document.createElement('div');
            content.className = `rounded-2xl p-3.5 text-sm leading-relaxed max-w-[85%] shadow-sm ${
                isUser 
                    ? 'bg-purple-600/30 border border-purple-500/40 text-slate-100 rounded-tr-none' 
                    : 'bg-slate-800/90 border border-slate-700/50 text-slate-200 rounded-tl-none'
            }`;

            if (isMarkdown && !isUser) {
                content.innerHTML = marked.parse(text);
            } else {
                content.innerText = text;
            }

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(content);
            chatBox.appendChild(msgDiv);
            scrollToBottom();
            return content;
        }

        // Handle Submit Form
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            if (!message) return;

            // 1. Tampilkan pesan user
            appendMessage('user', message);
            userInput.value = '';
            sendBtn.disabled = true;

            // 2. Tampilkan indikator Loading AI
            const loadingMsg = appendMessage('ai', 'Sedang berpikir...');

            try {
                // 3. Panggil API Flask (endpoint relatif "/chat")
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (response.ok) {
                    loadingMsg.innerHTML = marked.parse(data.response);
                } else {
                    loadingMsg.innerText = "Error dari AI: " + (data.error || "Gagal mendapatkan respon.");
                }
            } catch (error) {
                loadingMsg.innerText = "Gagal terhubung ke server Flask. Pastikan koneksi aman.";
                console.error("Fetch Error:", error);
            } finally {
                sendBtn.disabled = false;
                scrollToBottom();
            }
        });

        // Submit dengan Ctrl+Enter atau Enter biasa
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
